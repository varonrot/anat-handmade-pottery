services:
  - type: web
    runtime: static
    name: anat-handmade-pottery
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    autoDeploy: true
    routes:
      - type: redirect
        source: /sample-page
        destination: /
      - type: redirect
        source: /cart
        destination: /shop/
      - type: redirect
        source: /checkout
        destination: /shop/
      - type: redirect
        source: /my-account
        destination: /shop/
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
